name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite:///./data/test.db
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpassword123
        run: pytest tests/ -v

      - name: Validate migrations
        env:
          DATABASE_URL: sqlite:///./data/ci.db
        run: |
          python scripts/migrate.py
          python -c "from sqlalchemy import create_engine, text; e=create_engine('sqlite:///./data/ci.db'); assert e.connect().execute(text('select count(*) from users')).scalar() == 0"

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t financeiropython:ci .

      - name: Verify image starts
        run: |
          docker run -d --name test-container \
            -e SECRET_KEY=ci-test-secret-key-with-at-least-32-characters \
            -e APP_ENV=production \
            -e DATABASE_URL=sqlite:///./data/test.db \
            -e ADMIN_EMAIL=admin@test.com \
            -e ADMIN_PASSWORD=testpassword123 \
            -e RUN_SCHEDULER=false \
            -p 8000:8000 \
            financeiropython:ci
          sleep 8
          curl -f http://localhost:8000/healthz || exit 1
          docker stop test-container

  docker-push:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ulyssesrocharosa/meufinanceiro
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
